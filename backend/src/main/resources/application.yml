spring:
  application:
    name: campvivo-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Tham số nghiệp vụ (docs/02-ky-thuat/tech-stack.md). Map vào vn.campvivo.common.config.AppProperties.
# Secret chỉ lấy từ biến môi trường / application-dev.yml, KHÔNG ghi giá trị thật ở đây.
app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 24h
  otp:
    ttl: 10m
    max-attempts: 5
    resend-interval: 60s
  order:
    payment-timeout: 15m
  return:
    window-days: 7
  shipping:
    fee: 30000
    free-threshold: 1000000
  inventory:
    low-stock-threshold: 5
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:}
    ipn-url: ${VNPAY_IPN_URL:}
  cors:
    allowed-origins: http://localhost:3000
  frontend-url: http://localhost:3000
