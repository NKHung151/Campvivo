spring:
  application:
    name: campvivo-backend
  profiles:
    active: dev
  servlet:
    multipart:
      # Giới hạn nghiệp vụ 5MB kiểm tra ở ImageUploadService (thông báo lỗi rõ ràng); đây chỉ là trần kỹ thuật
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # Máy chủ SMTP gửi OTP/email (docs/02-ky-thuat/tech-stack.md). Mặc định trỏ Mailpit chạy bằng docker compose
  # (localhost:1025, không xác thực). Môi trường thật đặt SMTP_* (vd. Gmail: smtp.gmail.com:587, SMTP_AUTH và SMTP_STARTTLS = true).
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      # Không treo request đăng ký khi SMTP không phản hồi (mili giây)
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
logging:
  pattern:
    # Thêm mã request (RequestIdFilter) vào mỗi dòng log
    level: "%5p [%X{requestId:-}]"
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Không để /actuator/health báo DOWN chỉ vì chưa bật máy chủ SMTP (Mailpit) khi dev.
    mail:
      enabled: false

# Tham số nghiệp vụ (docs/02-ky-thuat/tech-stack.md). Map vào vn.campvivo.common.config.AppProperties.
# Secret chỉ lấy từ biến môi trường / application-dev.yml, KHÔNG ghi giá trị thật ở đây.
app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 24h
  otp:
    ttl: 10m
    max-attempts: 5
    resend-interval: 60s
  order:
    payment-timeout: 15m
  return:
    window-days: 7
  shipping:
    fee: 30000
    free-threshold: 1000000
  inventory:
    low-stock-threshold: 5
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:}
    ipn-url: ${VNPAY_IPN_URL:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: campvivo
  cors:
    allowed-origins: http://localhost:3000
  frontend-url: http://localhost:3000
