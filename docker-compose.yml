version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: campvivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campvivo
      POSTGRES_USER: campvivo
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - campvivo_pgdata:/var/lib/postgresql/data

  # Hộp thư giả cho dev: backend gửi OTP/email tới localhost:1025, xem thư ở http://localhost:8025 (không gửi ra ngoài).
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: campvivo-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  campvivo_pgdata:
