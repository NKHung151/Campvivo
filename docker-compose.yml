version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: campvivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campvivo
      POSTGRES_USER: campvivo
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - campvivo_pgdata:/var/lib/postgresql/data

volumes:
  campvivo_pgdata:
